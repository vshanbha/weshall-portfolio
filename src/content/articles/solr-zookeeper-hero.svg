<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="solrGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="zkGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7931e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font-size: 42px; font-weight: 800; fill: #FFFFFF; letter-spacing: -1px; }
      .subtitle { font-size: 18px; fill: #94a3b8; font-weight: 400; }
      .label { font-size: 14px; fill: #FFFFFF; font-weight: 600; }
      .node-label { font-size: 16px; fill: #FFFFFF; font-weight: 700; }
      .icon-text { font-size: 12px; fill: #FFFFFF; font-weight: 600; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad)"/>
  
  <!-- Decorative grid lines -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="900" y1="0" x2="900" y2="600"/>
  </g>
  
  <!-- Central title -->
  <text x="600" y="80" text-anchor="middle" class="title">Solr + ZooKeeper</text>
  <text x="600" y="110" text-anchor="middle" class="subtitle">Distributed Search Architecture</text>
  
  <!-- Left Node (N1) -->
  <g transform="translate(150, 200)">
    <!-- Node container -->
    <rect x="0" y="0" width="200" height="280" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="2" rx="16"/>
    <text x="100" y="35" text-anchor="middle" class="node-label">Node 1</text>
    
    <!-- Solr icon -->
    <circle cx="60" cy="100" r="40" fill="url(#solrGlow)" filter="url(#glow)"/>
    <text x="60" y="105" text-anchor="middle" class="icon-text">SOLR</text>
    
    <!-- ZooKeeper icon -->
    <circle cx="140" cy="100" r="40" fill="url(#zkGlow)" filter="url(#glow)"/>
    <text x="140" y="100" text-anchor="middle" class="icon-text">ZK</text>
    <text x="140" y="115" text-anchor="middle" font-size="10" fill="white">keeper</text>
    
    <!-- Shard replicas -->
    <circle cx="65" cy="200" r="28" fill="rgba(124,58,237,0.8)" filter="url(#softGlow)"/>
    <text x="65" y="195" text-anchor="middle" font-size="9" fill="white" font-weight="600">SH1</text>
    <text x="65" y="210" text-anchor="middle" font-size="8" fill="white">R1</text>
    
    <circle cx="135" cy="200" r="28" fill="rgba(124,58,237,0.5)" filter="url(#softGlow)"/>
    <text x="135" y="195" text-anchor="middle" font-size="9" fill="white" font-weight="600">SH2</text>
    <text x="135" y="210" text-anchor="middle" font-size="8" fill="white">R1</text>
    
    <!-- NAS -->
    <rect x="40" y="240" width="120" height="30" fill="rgba(0,212,255,0.3)" rx="6"/>
    <text x="100" y="260" text-anchor="middle" font-size="11" fill="white" font-weight="500">NAS Storage</text>
  </g>
  
  <!-- Center Node (N2) -->
  <g transform="translate(500, 200)">
    <!-- Node container -->
    <rect x="0" y="0" width="200" height="280" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="2" rx="16"/>
    <text x="100" y="35" text-anchor="middle" class="node-label">Node 2</text>
    
    <!-- Solr icon -->
    <circle cx="60" cy="100" r="40" fill="url(#solrGlow)" filter="url(#glow)"/>
    <text x="60" y="105" text-anchor="middle" class="icon-text">SOLR</text>
    
    <!-- ZooKeeper icon -->
    <circle cx="140" cy="100" r="40" fill="url(#zkGlow)" filter="url(#glow)"/>
    <text x="140" y="100" text-anchor="middle" class="icon-text">ZK</text>
    <text x="140" y="115" text-anchor="middle" font-size="10" fill="white">keeper</text>
    
    <!-- Shard replicas -->
    <circle cx="65" cy="200" r="28" fill="rgba(124,58,237,0.5)" filter="url(#softGlow)"/>
    <text x="65" y="195" text-anchor="middle" font-size="9" fill="white" font-weight="600">SH1</text>
    <text x="65" y="210" text-anchor="middle" font-size="8" fill="white">R2</text>
    
    <circle cx="135" cy="200" r="28" fill="rgba(124,58,237,0.8)" filter="url(#softGlow)"/>
    <text x="135" y="195" text-anchor="middle" font-size="9" fill="white" font-weight="600">SH2</text>
    <text x="135" y="210" text-anchor="middle" font-size="8" fill="white">R2</text>
    
    <!-- NAS -->
    <rect x="40" y="240" width="120" height="30" fill="rgba(0,212,255,0.3)" rx="6"/>
    <text x="100" y="260" text-anchor="middle" font-size="11" fill="white" font-weight="500">NAS Storage</text>
  </g>
  
  <!-- Right Node (N3) -->
  <g transform="translate(850, 200)">
    <!-- Node container -->
    <rect x="0" y="0" width="200" height="280" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="2" rx="16"/>
    <text x="100" y="35" text-anchor="middle" class="node-label">Node 3</text>
    
    <!-- Solr icon -->
    <circle cx="60" cy="100" r="40" fill="url(#solrGlow)" filter="url(#glow)"/>
    <text x="60" y="105" text-anchor="middle" class="icon-text">SOLR</text>
    
    <!-- ZooKeeper icon -->
    <circle cx="140" cy="100" r="40" fill="url(#zkGlow)" filter="url(#glow)"/>
    <text x="140" y="100" text-anchor="middle" class="icon-text">ZK</text>
    <text x="140" y="115" text-anchor="middle" font-size="10" fill="white">keeper</text>
    
    <!-- Shard replicas -->
    <circle cx="65" cy="200" r="28" fill="rgba(124,58,237,0.3)" filter="url(#softGlow)"/>
    <text x="65" y="195" text-anchor="middle" font-size="9" fill="white" font-weight="600">SH1</text>
    <text x="65" y="210" text-anchor="middle" font-size="8" fill="white">R3</text>
    
    <circle cx="135" cy="200" r="28" fill="rgba(124,58,237,0.5)" filter="url(#softGlow)"/>
    <text x="135" y="195" text-anchor="middle" font-size="9" fill="white" font-weight="600">SH2</text>
    <text x="135" y="210" text-anchor="middle" font-size="8" fill="white">R3</text>
    
    <!-- NAS -->
    <rect x="40" y="240" width="120" height="30" fill="rgba(0,212,255,0.3)" rx="6"/>
    <text x="100" y="260" text-anchor="middle" font-size="11" fill="white" font-weight="500">NAS Storage</text>
  </g>
  
  <!-- Connection lines between nodes -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="8,4">
    <line x1="350" y1="340" x2="500" y2="340"/>
    <line x1="700" y1="340" x2="850" y2="340"/>
    <line x1="350" y1="380" x2="500" y2="380"/>
    <line x1="700" y1="380" x2="850" y2="380"/>
  </g>
  
  <!-- Bottom stats -->
  <g transform="translate(0, 520)">
    <rect x="250" y="0" width="700" height="60" fill="rgba(255,255,255,0.05)" rx="8"/>
    
    <text x="350" y="35" text-anchor="middle" font-size="13" fill="#94a3b8">3 Nodes</text>
    <text x="500" y="35" text-anchor="middle" font-size="13" fill="#94a3b8">2 Shards</text>
    <text x="650" y="35" text-anchor="middle" font-size="13" fill="#94a3b8">6 Replicas</text>
    <text x="820" y="35" text-anchor="middle" font-size="13" fill="#94a3b8">Zero Downtime</text>
    
    <!-- Dots between stats -->
    <circle cx="425" cy="30" r="3" fill="#94a3b8"/>
    <circle cx="575" cy="30" r="3" fill="#94a3b8"/>
    <circle cx="735" cy="30" r="3" fill="#94a3b8"/>
  </g>
</svg>